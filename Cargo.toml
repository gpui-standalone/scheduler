[package]
name = "scheduler-gpui-standalone"
version = "1.10.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone mirror of Zed's scheduler crate."
repository = "https://github.com/zed-industries/zed"

[lib]
path = "src/scheduler.rs"
doctest = false
name = "scheduler"

[features]
test-support = []

[dependencies]
async-task = "^4.7"
backtrace = "^0.3"
chrono = {version = "^0.4", features = ["serde"]}
flume = "^0.11"
futures = "^0.3.32"
parking_lot = "^0.12.1"
rand = "^0.9"
web-time = "^1.1.0"
